name: validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation tools
        run: npm install -g ajv-cli ajv-formats markdownlint-cli

      - name: Validate SKILL.md frontmatter
        run: |
          set -euo pipefail
          for skill_dir in .agents/skills/*/; do
            skill_file="${skill_dir}SKILL.md"
            dir_name=$(basename "$skill_dir")

            if [ ! -f "$skill_file" ]; then
              echo "ERROR: Missing SKILL.md in $skill_dir"
              exit 1
            fi

            # Extract YAML frontmatter (between --- markers)
            frontmatter=$(sed -n '/^---$/,/^---$/p' "$skill_file" | sed '1d;$d')

            # Convert YAML frontmatter to JSON for validation
            echo "$frontmatter" | python3 -c "
          import sys, json, yaml
          data = yaml.safe_load(sys.stdin.read())
          json.dump(data, sys.stdout)
          " > /tmp/frontmatter.json

            # Validate against schema
            ajv validate -s schemas/skill-frontmatter.json -d /tmp/frontmatter.json --spec=draft2020

            # Assert name matches directory
            fm_name=$(python3 -c "import json; print(json.load(open('/tmp/frontmatter.json'))['name'])")
            if [ "$fm_name" != "$dir_name" ]; then
              echo "ERROR: Frontmatter name '$fm_name' does not match directory name '$dir_name' in $skill_dir"
              exit 1
            fi

            echo "OK: $skill_file"
          done

      - name: Lint SKILL.md files
        run: markdownlint '.agents/skills/*/SKILL.md' --disable MD013 MD033 MD041 MD060

      - name: Smoke test skills structure
        run: |
          set -euo pipefail
          for skill_dir in .agents/skills/*/; do
            skill_file="${skill_dir}SKILL.md"
            if [ ! -f "$skill_file" ]; then
              echo "ERROR: Missing SKILL.md in $skill_dir"
              exit 1
            fi
            # Verify frontmatter has required fields
            python3 -c "
          import yaml, sys
          with open('$skill_file') as f:
              content = f.read()
          fm = content.split('---')[1]
          data = yaml.safe_load(fm)
          assert 'name' in data, 'Missing name field'
          assert 'description' in data, 'Missing description field'
          print(f'  Skill: {data[\"name\"]} - OK')
          "
          done
          echo "All skills validated successfully."

      - name: Validate Cursor plugin manifest
        run: |
          set -euo pipefail

          # Schema is vendored verbatim from cursor/plugins so CI enforces the same
          # rules the marketplace does. Refresh it from:
          # https://github.com/cursor/plugins/blob/main/schemas/plugin.schema.json
          ajv validate -c ajv-formats \
            -s schemas/cursor-plugin.schema.json \
            -d .cursor-plugin/plugin.json

          # Cursor rejects a plugin whose manifest points at files that do not
          # exist, so every declared path is checked here rather than at review time.
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open(".cursor-plugin/plugin.json"))
          errors = []

          def repo_path(declared):
              """Manifest paths are relative to the plugin root, optionally './'-prefixed."""
              return declared[2:] if declared.startswith("./") else declared

          for field in ("skills", "mcpServers", "logo"):
              value = manifest.get(field)
              if value is None:
                  continue
              if not os.path.exists(repo_path(value)):
                  errors.append(f"{field}: declared path '{value}' does not exist")

          skills_dir = repo_path(manifest["skills"])
          skills = []
          if os.path.isdir(skills_dir):
              skills = sorted(
                  d for d in os.listdir(skills_dir)
                  if os.path.isdir(os.path.join(skills_dir, d))
              )
              if not skills:
                  errors.append(f"skills: no skill directories found under '{skills_dir}'")
              for skill in skills:
                  if not os.path.isfile(os.path.join(skills_dir, skill, "SKILL.md")):
                      errors.append(f"skills: '{skill}' has no SKILL.md")

          servers = {}
          mcp_path = repo_path(manifest["mcpServers"])
          if os.path.isfile(mcp_path):
              servers = json.load(open(mcp_path)).get("mcpServers")
              if not isinstance(servers, dict) or not servers:
                  errors.append("mcp.json: top-level 'mcpServers' object is required by Cursor")
                  servers = {}
              # Cursor rejects the VS Code-style "type" field on a remote server entry.
              # See docs.wherobots.com/develop/agentic-tools/cursor.
              for name, server in servers.items():
                  if "type" in server:
                      errors.append(f"mcp.json: server '{name}' must not set 'type'")
                  if not server.get("url"):
                      errors.append(f"mcp.json: server '{name}' is missing 'url'")

          if errors:
              print("\n".join(f"ERROR: {e}" for e in errors))
              sys.exit(1)

          print(f"Cursor plugin OK: {len(skills)} skills, {len(servers)} MCP server(s)")
          PY

      - name: Validate Kiro power
        run: |
          set -euo pipefail

          # Schema is vendored verbatim so CI enforces the published manifest rules.
          # Refresh it from https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          ajv validate --spec=draft2020 -c ajv-formats \
            -s schemas/agent-plugin.schema.json \
            -d powers/wherobots/plugin.json

          # Kiro copies a power without following symlinks, so the power carries real
          # files. The plugin manifest also has no field for a custom skills path.
          diff -r .agents/skills powers/wherobots/skills || {
            echo "ERROR: powers/wherobots/skills has drifted from .agents/skills."
            echo "Run: rm -rf powers/wherobots/skills && cp -R .agents/skills powers/wherobots/skills"
            exit 1
          }

          # Kiro loads no servers from a power whose mcp.json fails this schema. It needs
          # "type", which Cursor rejects, so the two files can only share the URL.
          ajv validate --spec=draft2020 -c ajv-formats \
            -s schemas/agent-mcp.schema.json \
            -d powers/wherobots/mcp.json

          python3 - <<'PY'
          import json
          import sys

          root = json.load(open("mcp.json"))["mcpServers"]
          power = json.load(open("powers/wherobots/mcp.json"))["mcpServers"]
          if {n: s["url"] for n, s in root.items()} != {n: s["url"] for n, s in power.items()}:
              sys.exit("ERROR: powers/wherobots/mcp.json and mcp.json list different servers or URLs.")
          PY

      - name: Validate Claude Code plugin and marketplace
        env:
          # Pinned so a validator change upstream cannot turn CI red without a
          # commit here. Bump deliberately.
          CLAUDE_CODE_VERSION: 2.1.311
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

          # --strict fails on warnings too, such as unknown manifest fields.
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

          # Claude Code needs "type" on a remote MCP server and Cursor rejects it,
          # so each manifest declares the server in its own shape. Keep them in step.
          python3 - <<'PY'
          import json, sys

          claude_manifest = json.load(open(".claude-plugin/plugin.json"))
          cursor_manifest = json.load(open(".cursor-plugin/plugin.json"))
          claude = claude_manifest["mcpServers"]
          cursor = json.load(open("mcp.json"))["mcpServers"]

          errors = []
          if claude_manifest["skills"].removeprefix("./") != cursor_manifest["skills"].removeprefix("./"):
              errors.append("skills: Claude and Cursor manifests point at different directories")
          if set(claude) != set(cursor):
              errors.append(f"server names differ: Claude {sorted(claude)} vs Cursor {sorted(cursor)}")
          for name in set(claude) & set(cursor):
              if claude[name].get("type") != "http":
                  errors.append(f"'{name}': Claude Code needs \"type\": \"http\" in .claude-plugin/plugin.json")
              if {k: v for k, v in claude[name].items() if k != "type"} != cursor[name]:
                  errors.append(f"'{name}': entry differs between .claude-plugin/plugin.json and mcp.json (beyond \"type\")")

          if errors:
              print("\n".join(f"ERROR: {e}" for e in errors))
              sys.exit(1)
          print(f"Claude Code plugin OK: MCP servers match mcp.json ({', '.join(sorted(claude))})")
          PY
